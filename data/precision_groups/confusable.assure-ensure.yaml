kind: confusable
groups:
  - id: confusable.assure-ensure
    pos: VERB
    sense_gloss: calming a person with a promise versus making an outcome certain
    options:
      - word: assure
        distinction: you tell someone so they feel confident; the object is a person
        example: I assured the client that the patch would ship by Friday.
        register: neutral
        details:
          collocations:
            - assure someone that
            - rest assured
          connotation: positive
      - word: ensure
        distinction: you take steps so that something happens; the object is a result
        example: Please ensure the backup completes before the cutover.
        register: neutral
        details:
          collocations:
            - ensure that
            - ensure compliance
          connotation: neutral
