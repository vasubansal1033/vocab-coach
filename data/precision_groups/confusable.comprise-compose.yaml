kind: confusable
groups:
  - id: confusable.comprise-compose
    pos: VERB
    sense_gloss: the whole contains its parts versus the parts make up the whole
    options:
      - word: comprise
        distinction: the whole comprises its parts (avoid "is comprised of" in careful writing)
        example: The working group comprises six engineers and one product manager.
        register: formal
        details:
          collocations:
            - comprise
            - comprising
          connotation: neutral
      - word: compose
        distinction: the parts compose the whole; "is composed of" is the common passive
        example: The panel is composed of reviewers from three teams.
        register: formal
        details:
          collocations:
            - composed of
            - compose the
          connotation: neutral
