kind: idiom
head_lemma: victory
groups:
- id: idiom.victory
  pos: NOUN
  sense_gloss: a win that costs too much
  options:
  - word: Pyrrhic victory
    distinction: a win whose cost outweighs the gain
    example: Beating the deadline with three people burned out was a Pyrrhic victory.
    register: neutral
    details:
      meaning: success that leaves you worse off overall
      tier: literary
      region: common
      variants: []
      misuse_example: They called any close match a Pyrrhic victory without looking
        at costs.
      avoid_when: when the win was cheap and lasting
      origin: Named after King Pyrrhus, whose costly wins against Rome nearly ruined
        his army.
