kind: confusable
groups:
  - id: confusable.persuade-convince
    pos: VERB
    sense_gloss: getting someone to act versus getting someone to believe
    options:
      - word: persuade
        distinction: you get someone to do something, often by argument or appeal
        example: She persuaded the team to ship the smaller release first.
        register: neutral
        details:
          collocations:
            - persuade someone to
            - try to persuade
          connotation: neutral
      - word: convince
        distinction: you get someone to accept that something is true
        example: The benchmark data convinced him that the rewrite was worth it.
        register: neutral
        details:
          collocations:
            - convince someone that
            - convince of
          connotation: neutral
