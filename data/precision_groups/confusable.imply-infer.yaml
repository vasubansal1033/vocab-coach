kind: confusable
groups:
  - id: confusable.imply-infer
    pos: VERB
    sense_gloss: a speaker or text suggests something versus a listener draws a conclusion
    options:
      - word: imply
        distinction: the speaker or text suggests something without stating it outright
        example: Her silence implies that the plan failed.
        register: neutral
        details:
          collocations:
            - imply that
            - seem to imply
          connotation: neutral
      - word: infer
        distinction: the listener or reader draws a conclusion from evidence
        example: From the error logs we inferred a race condition.
        register: neutral
        details:
          collocations:
            - infer from
            - infer that
          connotation: neutral
