kind: confusable
groups:
  - id: confusable.annoyed-irritated-exasperated-livid
    pos: ADJ
    sense_gloss: degrees of anger from mild bother to extreme fury
    options:
      - word: annoyed
        distinction: mildly bothered by something small
        example: I was annoyed that the meeting started ten minutes late.
        register: neutral
        details:
          collocations:
            - annoyed by
            - slightly annoyed
          connotation: negative
          strength: 1
      - word: irritated
        distinction: more sharply bothered; the feeling lasts and frays patience
        example: She grew irritated by the repeated context switches.
        register: neutral
        details:
          collocations:
            - irritated by
            - clearly irritated
          connotation: negative
          strength: 2
      - word: exasperated
        distinction: worn out by something that keeps happening; patience is spent
        example: He was exasperated after the third rollback of the same change.
        register: neutral
        details:
          collocations:
            - exasperated by
            - thoroughly exasperated
          connotation: negative
          strength: 3
      - word: livid
        distinction: extremely angry; far stronger than everyday workplace frustration
        example: The client was livid when the outage hit during their launch.
        register: neutral
        details:
          collocations:
            - livid about
            - absolutely livid
          connotation: negative
          strength: 4
