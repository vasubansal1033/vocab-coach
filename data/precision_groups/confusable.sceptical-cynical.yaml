kind: confusable
groups:
  - id: confusable.sceptical-cynical
    pos: ADJ
    sense_gloss: doubting a claim until evidence appears versus assuming bad motives
    options:
      - word: sceptical
        distinction: you withhold belief until you see good evidence
        example: She was sceptical of the vendor's latency claims until we ran our own test.
        register: neutral
        details:
          collocations:
            - sceptical of
            - remain sceptical
          connotation: neutral
      - word: cynical
        distinction: you assume people act from self-interest or that ideals are a front
        example: His cynical take was that the roadmap existed only to calm investors.
        register: neutral
        details:
          collocations:
            - cynical about
            - cynical view
          connotation: negative
