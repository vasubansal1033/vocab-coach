kind: idiom
head_lemma: threat
groups:
- id: idiom.threat
  pos: NOUN
  sense_gloss: constant danger hanging overhead
  options:
  - word: sword of Damocles
    distinction: a constant threat hanging over someone who seems secure
    example: The unpaid invoice hung over the renewal like a sword of Damocles.
    register: neutral
    details:
      meaning: imminent danger that makes a privileged position precarious
      tier: literary
      region: common
      variants: []
      misuse_example: A stage prop sword of Damocles hung from the ceiling.
      avoid_when: when there is no real pending threat
      origin: Damocles sat under a sword hung by a hair to learn how fragile power
        feels.
