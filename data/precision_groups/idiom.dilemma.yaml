kind: idiom
head_lemma: dilemma
groups:
- id: idiom.dilemma
  pos: NOUN
  sense_gloss: a bind where every option blocks another
  options:
  - word: Catch-22
    distinction: a rule that makes escape impossible by circular logic
    example: 'You need experience to get the role, but you need the role to get experience:
      a Catch-22.'
    register: neutral
    details:
      meaning: a no-win situation created by contradictory rules
      tier: literary
      region: common
      variants: []
      misuse_example: Please catch 22 of the balls in the drill.
      avoid_when: when a hard choice still has a workable path
      origin: From Joseph Heller's novel, where airmen could only be grounded for
        insanity but asking proved they were sane.
