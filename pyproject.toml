[project]
name = "vocab-coach"
version = "0.1.0"
description = "Replace vague English words with precise ones, through AI conversation and rewrite drills."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "authlib>=1.9.5",
    "fastapi>=0.162.2",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "langgraph>=1.2.20",
    "litellm>=1.108.4",
    "nltk>=3.10.4",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "spacy>=3.8.18",
    "sqlalchemy>=2.1.8",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
    "wordfreq>=3.1.1",
]

[project.scripts]
vocab = "vocab.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vocab"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/vocab/web/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"migrations/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["llm: calls real configured models; run with RUN_LLM_TESTS=1"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
