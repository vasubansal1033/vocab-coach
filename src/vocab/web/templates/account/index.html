{% extends "base.html" %}
{% block title %}Account · vocab-coach{% endblock %}
{% block content %}
<h1>Account</h1>
<p>Signed in as {{ user.display_name or user.email or user.id }}.</p>
<p><a href="/account/export">Download my data (JSON)</a></p>
<p><a href="/about/privacy">Privacy notice</a></p>
<form method="post" action="/account/delete"
      onsubmit="return confirm('Delete your account and all data? This cannot be undone.');">
  <button type="submit">Delete my account</button>
</form>
{% endblock %}
