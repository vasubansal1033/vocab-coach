{% extends "base.html" %}
{% block title %}New conversation · vocab-coach{% endblock %}
{% block content %}
<h1>New conversation</h1>
<form method="post" action="/conversations/new">
  <label>Conversation name
    <input type="text" name="name" required size="60"
           placeholder="e.g. Explaining a production outage to my team">
  </label>
  <label>Feedback expectations (optional)
    <textarea name="feedback_expectations" rows="4" cols="60"
              placeholder="e.g. Prefer SRE / incident vocabulary; keep tone calm and specific about blast radius and rollback."></textarea>
  </label>
  <p class="muted">Optional. Steers wording feedback toward the specialized terms that fit this situation.</p>
  <button type="submit">Start</button>
</form>
{% endblock %}
